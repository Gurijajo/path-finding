<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Path Finding in Georgia</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Path Finding Between Georgian Cities</h1>
        <div class="controls">
            <div class="input-group">
                <label for="startCity">Starting City:</label>
                <select id="startCity"></select>
            </div>
            <div class="input-group">
                <label for="endCity">Ending City:</label>
                <select id="endCity"></select>
            </div>
            <button id="runIDDFS">Run IDDFS Bidirectional</button>
            <button id="runAStar">Run A* Search</button>
            <button id="clearMap">Clear Map</button>
        </div>
        <div class="results">
            <div id="iddfsResults" class="result-box">
                <h2>IDDFS Bidirectional Results</h2>
                <p>Path: <span id="iddfsPath"></span></p>
                <p>Distance: <span id="iddfsDistance"></span> km</p>
                <p>Time Complexity: <span id="iddfsTimeComplexity"></span></p>
                <p>Space Complexity: <span id="iddfsSpaceComplexity"></span></p>
                <p>Execution Time: <span id="iddfsExecutionTime"></span> ms</p>
            </div>
            <div id="astarResults" class="result-box">
                <h2>A* Search Results</h2>
                <p>Path: <span id="astarPath"></span></p>
                <p>Distance: <span id="astarDistance"></span> km</p>
                <p>Time Complexity: <span id="astarTimeComplexity"></span></p>
                <p>Space Complexity: <span id="astarSpaceComplexity"></span></p>
                <p>Execution Time: <span id="astarExecutionTime"></span> ms</p>
            </div>
        </div>
        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="data.js"></script>
    <script src="search.js"></script>
    <script src="visualization.js"></script>
</body>
</html>
